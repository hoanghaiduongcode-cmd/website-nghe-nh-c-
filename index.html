<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Phát Nhạc Cá Nhân</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="player-wrapper">
        <div class="music-container" id="music-container">
            <div class="music-info">
                <h4 id="title">Chưa có bài hát nào</h4>
                <div class="progress-container" id="progress-container">
                    <div class="progress" id="progress"></div>
                </div>
            </div>

            <audio src="" id="audio"></audio>

            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&q=80" alt="music-cover" id="cover">
            </div>

            <div class="navigation">
                <button id="prev" class="action-btn">
                    <i class="fas fa-backward"></i>
                </button>
                <button id="play" class="action-btn action-btn-big">
                    <i class="fas fa-play"></i>
                </button>
                <button id="next" class="action-btn">
                    <i class="fas fa-forward"></i>
                </button>
            </div>
        </div>

        <!-- Khu vực quản lý File và Danh sách phát -->
        <div class="playlist-container">
            <input type="file" id="file-upload" accept="audio/mp3, audio/*" multiple hidden>
            <label for="file-upload" class="upload-btn">
                <i class="fas fa-plus-circle"></i> Thêm nhạc (MP3)
            </label>
            <ul id="playlist" class="playlist">
                <li class="empty-msg">Vui lòng chọn file nhạc để bắt đầu...</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
